<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Setup | Viveez Makeover</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="setup-style.css" />
</head>
<body>
  <div class="setup-container">
    <div class="setup-card fade-in-up">
      <div class="setup-header">
        <div class="logo-setup">
          <span class="logo-mark">V</span>
          <span class="logo-name">Viveez <span>Makeover</span></span>
        </div>
        <h1>Admin Setup</h1>
        <p class="setup-subtitle">Create your admin account to access the dashboard</p>
      </div>

      <form id="setupForm" class="setup-form">
        <div class="form-group">
          <label for="username">
            <i class="fas fa-user"></i>
            Admin Username
          </label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Enter username" 
            required 
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="password">
            <i class="fas fa-lock"></i>
            Password
          </label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter password" 
            required 
            autocomplete="new-password"
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">
            <i class="fas fa-lock"></i>
            Confirm Password
          </label>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            placeholder="Confirm password" 
            required 
            autocomplete="new-password"
          />
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <button type="submit" class="btn primary-btn" id="setupBtn">
          <span class="btn-text">Create Admin Account</span>
          <i class="fas fa-spinner fa-spin btn-loader" style="display: none;"></i>
        </button>
      </form>

      <div class="setup-footer">
        <p>Already have an account? <a href="/admin">Login here</a></p>
      </div>
    </div>

    <div class="setup-decor">
      <div class="decor-circle decor-1"></div>
      <div class="decor-circle decor-2"></div>
      <div class="decor-circle decor-3"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="setup-script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login | Viveez Makeover</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="admin-style.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-card fade-in-up">
      <div class="login-header">
        <div class="logo-setup">
          <span class="logo-mark">V</span>
          <span class="logo-name">Viveez <span>Makeover</span></span>
        </div>
        <h1>Admin Login</h1>
        <p class="login-subtitle">Access your admin dashboard</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="username">
            <i class="fas fa-user"></i>
            Username
          </label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Enter your username" 
            required 
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="password">
            <i class="fas fa-lock"></i>
            Password
          </label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password" 
            required 
            autocomplete="current-password"
          />
        </div>

        <div id="errorMessage" class="error-message"></div>

        <button type="submit" class="btn primary-btn" id="loginBtn">
          <span class="btn-text">Login</span>
          <i class="fas fa-spinner fa-spin btn-loader" style="display: none;"></i>
        </button>
      </form>

      <div class="login-footer">
        <p>Need to setup admin? <a href="/setup">Setup here</a></p>
      </div>
    </div>

    <div class="login-decor">
      <div class="decor-circle decor-1"></div>
      <div class="decor-circle decor-2"></div>
      <div class="decor-circle decor-3"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="admin-script.js"></script>
</body>
</html>

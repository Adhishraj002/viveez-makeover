<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard | Viveez Makeover</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="dashboard-style.css" />
</head>
<body>
  <div class="dashboard-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-setup">
          <span class="logo-mark">V</span>
          <span class="logo-name">Viveez <span>Makeover</span></span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-section="bookings">
          <i class="fas fa-calendar-check"></i>
          <span>Bookings</span>
        </a>
        <a href="#" class="nav-item" data-section="stats">
          <i class="fas fa-chart-bar"></i>
          <span>Statistics</span>
        </a>
        <a href="#" class="nav-item" id="exportBtn">
          <i class="fas fa-file-pdf"></i>
          <span>Export PDF</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="logout-btn" id="logoutBtn">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
      <header class="dashboard-header">
        <div class="header-content">
          <h1 class="page-title">Admin Dashboard</h1>
          <div class="header-actions">
            <button class="refresh-btn" id="refreshBtn" title="Refresh Data">
              <i class="fas fa-sync-alt"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Stats Cards -->
      <section class="stats-section" id="statsSection">
        <div class="stats-grid">
          <div class="stat-card fade-in-up">
            <div class="stat-icon">
              <i class="fas fa-calendar-check"></i>
            </div>
            <div class="stat-content">
              <h3 class="stat-value" id="totalBookings">0</h3>
              <p class="stat-label">Total Bookings</p>
            </div>
          </div>

          <div class="stat-card fade-in-up">
            <div class="stat-icon">
              <i class="fas fa-calendar-day"></i>
            </div>
            <div class="stat-content">
              <h3 class="stat-value" id="todayBookings">0</h3>
              <p class="stat-label">Today's Bookings</p>
            </div>
          </div>

          <div class="stat-card fade-in-up">
            <div class="stat-icon">
              <i class="fas fa-users"></i>
            </div>
            <div class="stat-content">
              <h3 class="stat-value" id="totalCustomers">0</h3>
              <p class="stat-label">Total Customers</p>
            </div>
          </div>

          <div class="stat-card fade-in-up">
            <div class="stat-icon">
              <i class="fas fa-star"></i>
            </div>
            <div class="stat-content">
              <h3 class="stat-value" id="popularEvent">-</h3>
              <p class="stat-label">Popular Event</p>
            </div>
          </div>
        </div>
      </section>

      <!-- Bookings Section -->
      <section class="bookings-section active-section" id="bookingsSection">
        <div class="section-header">
          <h2>All Bookings</h2>
          <div class="section-controls">
            <input 
              type="text" 
              id="searchInput" 
              class="search-input" 
              placeholder="Search bookings..."
            />
            <select id="filterSelect" class="filter-select">
              <option value="all">All Events</option>
              <option value="Bridal Makeover">Bridal Makeover</option>
              <option value="Groom Makeover">Groom Makeover</option>
              <option value="Engagement & Reception">Engagement & Reception</option>
              <option value="Pre_Wedding & Destination Wedding">Pre-Wedding</option>
            </select>
          </div>
        </div>

        <div class="bookings-container" id="bookingsContainer">
          <div class="loading-state" id="loadingState">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading bookings...</p>
          </div>
          <div class="empty-state" id="emptyState" style="display: none;">
            <i class="fas fa-inbox"></i>
            <p>No bookings found</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Booking Detail Modal -->
  <div class="modal" id="bookingModal" aria-hidden="true">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <button class="modal-close" id="modalClose">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="dashboard-script.js"></script>
</body>
</html>
